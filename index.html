<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1320" />
    <title>ワークアウトタイマー</title>
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1 class="app__title">ワークアウトタイマー</h1>
        <label class="field">
          <span class="field__label">メニュー</span>
          <select id="timeline-select" class="field__control"></select>
        </label>
      </header>

      <section class="now" data-category="rest" id="now">
        <div class="now__meta">
          <span class="badge" id="category-badge">—</span>
          <span class="now__round" id="round"></span>
        </div>
        <p class="now__label" id="current-label">スタートを押してください</p>
        <p class="now__sub" id="current-sub"></p>
        <div class="now__count" id="segment-remaining">0</div>
        <div class="segbar" aria-hidden="true"><div class="segbar__fill" id="segment-bar"></div></div>
        <p class="now__next" id="next-label"></p>
      </section>

      <section class="overall">
        <div class="overall__times">
          <span id="elapsed">0:00</span>
          <span id="total">0:00</span>
        </div>
        <div class="progress" role="progressbar" aria-label="全体の進捗">
          <div class="progress__fill" id="progress-bar"></div>
        </div>
        <p class="overall__remaining">残り <span id="remaining">0:00</span></p>
      </section>

      <section class="controls">
        <button class="btn btn--primary" id="toggle" type="button">開始</button>
        <button class="btn" id="reset" type="button">リセット</button>
      </section>

      <p class="notice" id="notice" hidden></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
